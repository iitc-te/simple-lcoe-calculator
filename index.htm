<!DOCTYPE html>
<html lang="en">

<head>

    <title>Simple LCOE Calculator</title>

    <meta charset="utf-8" />
    <meta name="description" content="Calculate the Levelized Cost of Electricity (LCOE) for a utility-scale power plant. Accounts for CAPEX, lifetime, capacity factor, O&amp;M, fuel, taxes, and discount rate." />
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />

    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Simple LCOE Calculator" />
    <meta property="og:description" content="Calculate the Levelized Cost of Electricity (LCOE) for a utility-scale power plant. Accounts for CAPEX, lifetime, capacity factor, O&amp;M, fuel, taxes, and discount rate." />
    <meta property="og:url"         content="https://iitc-te.github.io/simple-lcoe-calculator/" />
    <meta property="og:image"       content="https://iitc-te.github.io/simple-lcoe-calculator/appl.jpg" />

    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Simple LCOE Calculator" />
    <meta name="twitter:description" content="Calculate the Levelized Cost of Electricity (LCOE) for a utility-scale power plant. Accounts for CAPEX, lifetime, capacity factor, O&amp;M, fuel, taxes, and discount rate." />

    <link href="assets/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/bootstrap/icons/1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="assets/nouislider/15.2.0/nouislider.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <link href="appl.svg" rel="icon" />

</head>

<body>

    <nav class="navbar navbar-app" aria-label="Site navigation">
        <div class="container-fluid">
            <a class="navbar-brand" href="./">
                <img src="appl.svg" alt="" width="32" height="32" class="d-inline-block align-text-center me-2">
                Simple LCOE Calculator
            </a>
        </div>
    </nav>

    <main>
        <div class="container-fluid">
            <div class="row">

                <div class="col-md-4 col-panel">

                    <div class="mb-4">
                        <label id="lbl-cDurat" class="form-label">Construction duration (Years)</label>
                        <div id="slider-cDurat" class="slider-field" aria-labelledby="lbl-cDurat"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="cCosts">CAPEX ($ per kW of installed capacity)</label>
                        <input type="number" class="form-control v_in" id="cCosts" value="4013" onclick="this.select();" />
                    </div>

                    <div class="mb-4">
                        <label id="lbl-oDurat" class="form-label">Economic lifetime (Years)</label>
                        <div id="slider-oDurat" class="slider-field" aria-labelledby="lbl-oDurat"></div>
                    </div>

                    <div class="mb-4">
                        <label id="lbl-oCapaf" class="form-label">Capacity factor (%)</label>
                        <div id="slider-oCapaf" class="slider-field" aria-labelledby="lbl-oCapaf"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="fCosts">Fixed O&amp;M cost ($ per kW per Year)</label>
                        <input type="number" class="form-control v_in" id="fCosts" value="99.1" onclick="this.select();" />
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="vCosts1">Variable O&amp;M cost ($ per MWh)</label>
                        <input type="number" class="form-control v_in" id="vCosts1" value="1" onclick="this.select();" />
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="vCosts2">Variable fuel cost ($ per MWh)</label>
                        <input type="number" class="form-control v_in" id="vCosts2" value="9.33" onclick="this.select();" />
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="vCosts3">Taxes ($ per MWh)</label>
                        <input type="number" class="form-control v_in" id="vCosts3" value="0" onclick="this.select();" />
                    </div>

                    <div class="mb-0">
                        <label id="lbl-dRate" class="form-label">Discount rate (%)</label>
                        <div id="slider-dRate" class="slider-field" aria-labelledby="lbl-dRate"></div>
                    </div>

                </div>

                <div class="col-md-8 col-panel">

                    <div class="lcoe-result-box mb-4">
                        <label class="form-label" for="rr1">LCOE ($ per MWh)</label>
                        <input type="text" class="form-control lcoe-value" id="rr1"
                               value="-" onclick="this.select();" readonly />
                    </div>

                    <div id="chart" class="mb-4" aria-hidden="true"></div>

                    <div id="share-box" class="d-none mb-0">
                        <div class="input-group input-group-sm">
                            <input type="text" id="share-url" class="form-control share-url-input"
                                   aria-label="Shareable link to this calculation"
                                   readonly onclick="this.select();" />
                            <button class="btn btn-outline-secondary" id="btn-copy" type="button"
                                    aria-label="Copy link to clipboard">
                                <i class="bi bi-clipboard" aria-hidden="true"></i> Copy
                            </button>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <script>var appl_iden = "simple-lcoe-calculator";</script>
    <script src="assets/jquery/3.6.0/jquery.min.js"></script>
    <script src="assets/nouislider/15.2.0/nouislider.min.js"></script>
    <script src="assets/d3/7.7.0/d3.min.js"></script>
    <script src="data.js"></script>
    <script src="io.js"></script>
    <script src="calculation.js"></script>
    <script src="sliders.js"></script>
    <script src="chart.js"></script>
    <script src="app.js"></script>

</body>

</html>
